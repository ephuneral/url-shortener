apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
  namespace: url-shortener
  labels:
    app: url-shortener
spec:
  replicas: 1
  selector:
    matchLabels:
      app: url-shortener
  template:
    metadata:
      labels:
        app: url-shortener
    spec:
      containers:
      - name: url-shortener
        image: ghcr.io/ephuneral/url-shortener:ff08846
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: url-shortener-secret  # ← Секреты из .env (создашь вручную)
        - configMapRef:
            name: url-shortener-config  # ← Не-секретные настройки
        env:
        - name: DB_HOST
          value: "postgres"  # ← Имя сервиса PostgreSQL
        - name: DB_PORT
          value: "5432"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"